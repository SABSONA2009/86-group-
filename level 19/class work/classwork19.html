<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <title>Forms</title>
</head>
<body>

    <h2>Registration Form</h2>

    <form>
        <label for="name">სახელი:</label><br>
        <input type="text" id="name" name="name"><br><br>

        <label for="surname">გვარი:</label><br>
        <input type="text" id="surname" name="surname"><br><br>

        <label for="email">ემაილი:</label><br>
        <input type="email" id="email" name="email"><br><br>

        <label for="password">პაროლი:</label><br>
        <input type="password" id="password" name="password"><br><br>

        <button>Register</button>
    </form>

    

    <h2>Second Form</h2>

    <form>
        <label for="age">ასაკი:</label><br>
        <input type="number" id="age" name="age"><br><br>

        <label for="birthdate">დაბადების თარიღი:</label><br>
        <input type="date" id="birthdate" name="birthdate"><br><br>

        <label for="color">ფერი:</label><br>
        <input type="color" id="color" name="color"><br><br>

        <label for="gender">სქესი:</label><br>
        <select id="gender" name="gender">
            <option value="">აირჩიეთ</option>
            <option value="male">მამრობითი</option>
            <option value="female">მდედრობითი</option>
        </select><br><br>

        <label for="agree">
            <input type="checkbox" id="agree" name="agree">
            ვეთანხმები წესებს
        </label><br><br>

        <button>click me</button>
    </form>

</body>
</html>
