<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <title>Form</title>
</head>
<body>

    <form>
        <label for="name">name:</label><br>
        <input type="text" id="name" name="name" placeholder="name" required>
        <br><br>

        <label for="surname">lastname:</label><br>
        <input type="text" id="surname" name="surname" placeholder="enter your lastname">
        <br><br>

        <label for="email">email:</label><br>
        <input type="email" id="email" name="email" placeholder="mail.com" required>
        <br><br>

        <label for="password">password:</label><br>
        <input type="password" id="password" name="password" placeholder="შეიყვანეთ პაროლი" required>
        <br><br>

            
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">male</label>

        <input type="radio" id="female" name="gender" value="female">
        <label for="female">female</label>


        <button type="submit">Register</button>
    </form>

</body>
</html>
